[package]
name = "ingjoo-infra"
version.workspace = true
edition.workspace = true
description = "莺竹框架基础设施 — ScaffDb, Auth, Storage, SMS, Email, Captcha 参考实现"
license = "MIT"
keywords = ["ingjoo", "infra", "auth", "storage"]
categories = ["web-programming", "authentication"]

[features]
default = ["db", "auth"]
full = ["db", "auth", "email", "sms", "captcha", "s3"]
mock = []
db = ["sqlx"]
auth = ["argon2", "jsonwebtoken", "sha2", "uuid", "chrono", "rand"]
email = ["lettre"]
sms = ["reqwest", "hmac", "sha2", "hex", "chrono", "serde_json"]
captcha = ["image", "rand", "base64"]
s3 = ["aws-sdk-s3", "aws-config"]

[dependencies]
ingjoo-core = { path = "../ingjoo-core" }
tokio.workspace = true
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
axum.workspace = true
tower-http.workspace = true
async-trait.workspace = true

sqlx = { workspace = true, optional = true }
argon2 = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dependencies.aws-sdk-s3]
workspace = true
optional = true

[dependencies.aws-config]
workspace = true
optional = true
