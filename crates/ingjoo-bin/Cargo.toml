[package]
name = "ingjoo-bin"
version.workspace = true
edition.workspace = true
description = "莺竹框架开发入口 — axum 可执行二进制"
license = "MIT"

[[bin]]
name = "ingjoo-bin"
path = "src/main.rs"

[features]
default = ["db", "auth"]
db = ["ingjoo-infra/db"]
auth = ["ingjoo-infra/auth"]
content-filter = ["ingjoo-infra/content-filter"]
data-mask = ["ingjoo-infra/data-mask"]
signature = ["ingjoo-infra/signature"]
multi-db = ["ingjoo-infra/multi-db"]
email = ["ingjoo-infra/email"]
sms = ["ingjoo-infra/sms"]
s3 = ["ingjoo-infra/s3"]
full = ["db", "auth", "content-filter", "data-mask", "signature", "multi-db", "email", "sms", "s3"]

[dependencies]
ingjoo-core = { path = "../ingjoo-core" }
ingjoo-infra = { path = "../ingjoo-infra" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
chrono.workspace = true

[dev-dependencies]
tower.workspace = true
http.workspace = true
uuid.workspace = true
tempfile = "3"
ingjoo-security = { path = "../ingjoo-security" }
